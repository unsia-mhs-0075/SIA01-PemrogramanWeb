<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Internal CSS</title>

    <!-- Internal CSS: ditulis di dalam tag <style> pada <head> -->
    <style>
        h1 {
            color: green;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Belajar CSS</h1>
    <p>CSS mengatur tampilan halaman web.</p>
</body>
</html>
