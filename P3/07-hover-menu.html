<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Efek Hover pada Menu</title>
    <style>
        nav a {
            display: inline-block;
            padding: 10px 15px;
            color: white;
            background-color: #333;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #007bff;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#beranda">Beranda</a>
        <a href="#profil">Profil</a>
        <a href="#kontak">Kontak</a>
    </nav>
</body>
</html>
