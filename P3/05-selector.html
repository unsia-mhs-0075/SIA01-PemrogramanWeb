<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Selector CSS</title>
    <style>
        /* Element selector */
        p {
            color: gray;
        }

        /* Class selector */
        .informasi {
            color: green;
        }

        /* ID selector */
        #judul-utama {
            color: navy;
        }
    </style>
</head>
<body>
    <h1 id="judul-utama">Belajar CSS</h1>

    <p>Paragraf biasa (element selector).</p>

    <p class="informasi">Informasi pertama.</p>
    <p class="informasi">Informasi kedua.</p>
</body>
</html>
