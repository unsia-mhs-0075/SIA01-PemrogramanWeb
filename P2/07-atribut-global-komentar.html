<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Atribut Global dan Komentar</title>
</head>
<body>
    <!-- Atribut global: id, class, title, style, hidden -->
    <p id="pesan" class="informasi" title="Pesan pembuka">
        Selamat belajar HTML.
    </p>

    <p style="color: green;" hidden>Elemen ini tidak ditampilkan (hidden).</p>

    <!-- Ini adalah komentar HTML, tidak ditampilkan di halaman -->
    <p>Konten halaman web.</p>
</body>
</html>
